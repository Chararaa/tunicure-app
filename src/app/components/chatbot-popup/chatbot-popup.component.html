<div class="chatbot-container">
  <!-- Bouton flottant -->
  <button class="chatbot-toggle" (click)="toggleChat()" [class.open]="isOpen">
    <span class="chat-icon" *ngIf="!isOpen">💬</span>
    <span class="close-icon" *ngIf="isOpen">✕</span>
  </button>

  <!-- Popup du chatbot -->
  <div class="chatbot-popup" [class.open]="isOpen">
    <!-- Header -->
    <div class="chat-header">
      <div class="clinic-brand">
        <div class="avatar">👨‍⚕️</div>
        <div class="clinic-info">
          <h3 style="color: white">Assistant TuniCure</h3>
        </div>
      </div>

      <!-- Selecteur de langue -->
      <div class="language-selector me-3">
        <select
          [(ngModel)]="selectedLanguage"
          (change)="changeLanguage()"
          class="lang-select"
        >
          <option *ngFor="let lang of languages" [value]="lang.code">
            {{ lang.flag }} {{ lang.name }}
          </option>
        </select>
      </div>

      <div class="chat-controls">
        <button
          class="btn-clear"
          (click)="clearChat()"
          title="Effacer l'historique"
        >
          🗑️
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages">
      <!-- Message de bienvenue -->
      <div class="messages-scroll-container" #scrollContainer>
        <div class="welcome-banner" *ngIf="messages.length === 0">
          <h4>Bienvenue !</h4>
          <p>Je peux vous informer sur :</p>
          <div class="procedures-list">
            <span *ngFor="let proc of clinicProcedures" class="procedure-tag">
              {{ proc }}
            </span>
          </div>
        </div>
        <!-- Historique des messages -->
        <!-- Historique des messages -->
        <div *ngFor="let msg of messages" [class]="'message ' + msg.sender">
          <div class="message-avatar" *ngIf="msg.sender === 'bot'">
            <span>🤖</span>
          </div>

          <div class="message-content">
            <!-- Utilisez innerHTML pour interpréter le HTML, avec gestion des clics -->
            <div
              class="message-text"
              [innerHTML]="
                msg.sender === 'bot' ? (msg.text | safeHtml) : msg.text
              "
              (click)="handleMessageClick($event, msg)"
            ></div>

            <div class="message-image" *ngIf="msg.imageUrl">
              <img
                [src]="msg.imageUrl"
                alt="Illustration"
                class="response-image clickable"
                (click)="openImageModal(msg.imageUrl)"
              />
              <small class="image-caption"
                >Cliquez sur l'image pour agrandir</small
              >
            </div>

            <div class="message-meta">
              <span class="time">{{ msg.timestamp | date: "HH:mm" }}</span>
            </div>
          </div>

          <div class="message-avatar user" *ngIf="msg.sender === 'user'">
            <span>👤</span>
          </div>
        </div>

        <!-- Indicateur de frappe -->
        <div class="typing-indicator" *ngIf="isTyping">
          <div class="avatar">
            <span>🤖</span>
          </div>
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Questions rapides -->
    <div class="quick-questions" *ngIf="messages.length < 3">
      <p>Questions fréquentes :</p>
      <div class="quick-buttons">
        <button
          *ngFor="let question of getCurrentQuickQuestions()"
          (click)="sendQuickQuestion(question)"
          class="quick-btn"
        >
          {{ question }}
        </button>
      </div>
    </div>

    <!-- Zone de saisie -->
    <div class="chat-input">
      <input
        type="text"
        [(ngModel)]="userInput"
        (keyup.enter)="sendMessage()"
        placeholder="Tapez votre question sur nos procédures..."
        [disabled]="isTyping"
      />
      <button
        class="btn-send"
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isTyping"
      >
        <span class="send-icon">↑</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="chat-footer">
      <small>Assistant local • Réponses instantanées • 100% gratuit</small>
    </div>
  </div>
  <div class="image-modal" *ngIf="isImageModalOpen" (click)="closeImageModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" [src]="selectedImage" alt="Image agrandie" />
  </div>
</div>
